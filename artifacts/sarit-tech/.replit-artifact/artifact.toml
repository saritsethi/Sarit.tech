kind = "web"
previewPath = "/"
title = "sarit.tech"
version = "1.0.0"
id = "artifacts/sarit-tech"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23106

[services.development]
run = "pnpm --filter @workspace/sarit-tech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sarit-tech", "run", "build" ]
publicDir = "artifacts/sarit-tech/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23106"
BASE_PATH = "/"
